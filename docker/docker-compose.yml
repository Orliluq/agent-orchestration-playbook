version: '3.8'

services:
  # Servicio principal de orquestación de agentes
  agent-orchestration:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: agent-orchestration-app
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
      - STORAGE_TYPE=file
      - METRICS_ENABLED=true
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Prometheus para métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: agent-orchestration-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - agent-network
    restart: unless-stopped

  # Grafana para dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: agent-orchestration-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - agent-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # Redis para caché y colas (opcional)
  redis:
    image: redis:7-alpine
    container_name: agent-orchestration-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agent-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # PostgreSQL para persistencia (opcional)
  postgres:
    image: postgres:15-alpine
    container_name: agent-orchestration-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=agent_orchestration
      - POSTGRES_USER=agent_user
      - POSTGRES_PASSWORD=agent_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - agent-network
    restart: unless-stopped

  # Nginx como reverse proxy (opcional)
  nginx:
    image: nginx:alpine
    container_name: agent-orchestration-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    networks:
      - agent-network
    restart: unless-stopped
    depends_on:
      - agent-orchestration

volumes:
  prometheus_data:
  grafana_data:
  redis_data:
  postgres_data:

networks:
  agent-network:
    driver: bridge